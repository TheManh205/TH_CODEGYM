<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Thẻ Sản Phẩm - Product Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Khối chính bao bọc Thẻ sản phẩm -->
    <div class="product-card">
      <!-- 1. Hình ảnh sản phẩm -->
      <img
        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80"
        alt="Tai nghe Bluetooth không dây cao cấp"
        class="product-img"
      />

      <!-- 2. Khối nội dung thông tin sản phẩm -->
      <div class="product-content">
        <h3 class="product-title">Tai Nghe Bluetooth Premium</h3>
        <p class="price">1.290.000 ₫</p>

        <!-- 3. Nút Thêm vào giỏ hàng -->
        <a href="#" class="btn">Thêm Vào Giỏ Hàng</a>
      </div>
    </div>
  </body>
</html>
