<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thí nghiệm So sánh Block vs. Inline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sàn Đấu Thí Nghiệm: Block vs. Inline</h1>

    <h2>1. Phần tử Block (sử dụng &lt;div&gt;)</h2>
    <div class="box block-box">Block 1</div>
    <div class="box block-box">Block 2</div>

    <hr />

    <h2>2. Phần tử Inline (sử dụng &lt;span&gt;)</h2>
    <p>
      Đây là một đoạn văn bản mẫu chứa phần tử
      <span class="box inline-box">Inline 1</span>
      và phần tử
      <span class="box inline-box">Inline 2</span>
      nằm trực tiếp trong dòng chữ để quan sát hành vi.
    </p>
  </body>
</html>
